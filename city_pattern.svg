<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Coastline (Beach & Sea boundary) -->
  <path d="M 0,220 Q 120,200 180,240 T 300,210" fill="none" stroke="#1B3C6E" stroke-width="2" stroke-dasharray="8 6"/>
  <path d="M 0,235 Q 120,215 180,255 T 300,225" fill="none" stroke="#1B3C6E" stroke-width="1.5" opacity="0.7" stroke-dasharray="4 4"/>
  <!-- Sea Wave elements -->
  <path d="M 30,260 Q 45,255 60,260" fill="none" stroke="#1B3C6E" stroke-width="1" opacity="0.6"/>
  <path d="M 140,270 Q 155,265 170,270" fill="none" stroke="#1B3C6E" stroke-width="1" opacity="0.6"/>
  <path d="M 230,250 Q 245,245 260,250" fill="none" stroke="#1B3C6E" stroke-width="1" opacity="0.6"/>
  
  <!-- Beach Sand dots/textures -->
  <circle cx="10" cy="205" r="1" fill="#F5A623" opacity="0.5"/>
  <circle cx="50" cy="195" r="1.2" fill="#F5A623" opacity="0.5"/>
  <circle cx="90" cy="200" r="0.8" fill="#F5A623" opacity="0.5"/>
  <circle cx="150" cy="220" r="1.1" fill="#F5A623" opacity="0.5"/>
  <circle cx="210" cy="225" r="1" fill="#F5A623" opacity="0.5"/>
  <circle cx="270" cy="190" r="1.2" fill="#F5A623" opacity="0.5"/>

  <!-- City Roads -->
  <!-- Vertical main road -->
  <line x1="80" y1="0" x2="80" y2="185" stroke="#1B3C6E" stroke-width="6"/>
  <line x1="80" y1="0" x2="80" y2="185" stroke="#fff" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- Horizontal main road -->
  <line x1="0" y1="90" x2="300" y2="90" stroke="#1B3C6E" stroke-width="6"/>
  <line x1="0" y1="90" x2="300" y2="90" stroke="#fff" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- Secondary road -->
  <line x1="200" y1="0" x2="200" y2="210" stroke="#1B3C6E" stroke-width="4"/>
  <line x1="0" y1="30" x2="300" y2="30" stroke="#1B3C6E" stroke-width="4"/>

  <!-- Intersection/Roundabout -->
  <circle cx="80" cy="90" r="10" fill="#1B3C6E"/>
  <circle cx="80" cy="90" r="6" fill="none" stroke="#fff" stroke-width="1"/>

  <!-- Buildings / City Blocks -->
  <!-- Block 1 (Top Left) -->
  <rect x="15" y="10" width="20" height="15" rx="2" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  <rect x="45" y="10" width="20" height="15" rx="2" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  <rect x="15" y="35" width="50" height="40" rx="3" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  <!-- Block 2 (Top Mid) -->
  <rect x="95" y="10" width="40" height="25" rx="3" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  <rect x="145" y="10" width="40" height="25" rx="3" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  <rect x="95" y="45" width="90" height="35" rx="4" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  <!-- Block 3 (Top Right) -->
  <rect x="215" y="10" width="30" height="30" rx="3" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  <rect x="255" y="10" width="30" height="30" rx="3" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  <rect x="215" y="50" width="70" height="30" rx="4" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  
  <!-- Block 4 (Bottom Left) -->
  <rect x="15" y="105" width="25" height="25" rx="3" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  <rect x="45" y="105" width="20" height="20" rx="2" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  <rect x="15" y="140" width="50" height="30" rx="3" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  
  <!-- Block 5 (Bottom Mid) -->
  <rect x="95" y="105" width="35" height="45" rx="3" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  <circle cx="160" cy="130" r="15" fill="none" stroke="#1B3C6E" stroke-width="1.5"/> <!-- Park / Green area -->
  <circle cx="160" cy="130" r="8" fill="none" stroke="#1B3C6E" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="95" y="160" width="90" height="20" rx="2" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  
  <!-- Block 6 (Bottom Right) -->
  <rect x="215" y="105" width="30" height="40" rx="3" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  <rect x="255" y="105" width="30" height="40" rx="3" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  <rect x="215" y="155" width="70" height="25" rx="3" fill="none" stroke="#1B3C6E" stroke-width="1.5"/>
  
  <!-- Trees / Green points -->
  <circle cx="140" cy="120" r="2" fill="#2e7d32" opacity="0.8"/>
  <circle cx="145" cy="140" r="2" fill="#2e7d32" opacity="0.8"/>
  <circle cx="175" cy="125" r="2.5" fill="#2e7d32" opacity="0.8"/>
  <circle cx="178" cy="145" r="2" fill="#2e7d32" opacity="0.8"/>
  <circle cx="215" cy="190" r="2.5" fill="#2e7d32" opacity="0.8"/>
</svg>
